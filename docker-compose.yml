name: nustrad-erp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nustrad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nustrad}
      POSTGRES_DB: ${POSTGRES_DB:-nustrad}
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nustrad} -d ${POSTGRES_DB:-nustrad}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nustrad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nustrad-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nustrad:nustrad@db:5432/nustrad}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+asyncpg://nustrad:nustrad@db:5432/nustrad_test}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  minio-data:
  web-node-modules:
